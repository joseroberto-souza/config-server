server:
  port: 8888 # Define a porta padrão de escuta do servidor de configuração.

spring:
  application:
    name: config-server # Define o nome identificador deste serviço no catálogo.
  cloud:
    config:
      server:
        git:
          # Define o endereço do repositório Git com os arquivos de configuração.
          uri: https://github.com/joseroberto-souza/config-server.git
          # Seleciona a branch padrão onde o servidor lê as propriedades.
          default-label: master
          # Baixa os arquivos do repositório Git imediatamente ao iniciar o servidor.
          clone-on-start: true

# Configurações de registro no Eureka Server
eureka:
  client:
    service-url:
      # Define o endereço base onde este serviço registra a sua disponibilidade.
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Usa o endereço IP em vez do nome do host ao registrar a instância.
    prefer-ip-address: true
